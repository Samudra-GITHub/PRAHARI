# PRAHARI — full stack: PostgreSQL + backend API + frontend.
#
#   cp .env.example .env        # then fill in every secret
#   docker compose up --build
#
#   Frontend          http://localhost:3001
#   API + Swagger UI  http://localhost:3000/api-docs
#
# Adapted from the Compose setup in Jeevan's infra prototype (PostgreSQL with a
# healthcheck and a named volume), wired to the canonical PRAHARI services.
#
# Use http://localhost, not a LAN IP, when testing over plain HTTP: the backend
# marks its refresh cookie Secure in production, and browsers only accept
# Secure cookies over HTTP on localhost. Real deployments should terminate TLS
# in front of the frontend.

name: prahari

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prahari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-prahari}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host — only the backend talks to the database.
    # To connect a local client, uncomment (bound to loopback only):
    # ports:
    #   - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prahari}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prahari}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (see .env.example)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env (see .env.example)}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env (see .env.example)}
      # Demo stack: seeds four demo accounts (password demo12345) and the
      # fictional mine portfolio. Set SEED_DEMO_DATA=false for any real use.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend/prahari-frontend-main
      args:
        # Compiled into the build — see the frontend Dockerfile.
        BACKEND_ORIGIN: http://backend:3000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  pgdata:
